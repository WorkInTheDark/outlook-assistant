<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RA Reply</title>
    <link rel="stylesheet" href="taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <div id="devBar" class="dev-bar" hidden>
      <label>Dev preview: <select id="devSample"></select></label>
    </div>

    <header class="bar">
      <div id="emailMeta" class="email-meta">Loading…</div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M11.3 1.5l.4 2.1c.5.2 1 .5 1.4.8l2-.7 1.3 2.2-1.6 1.4c.1.5.1 1.1 0 1.6l1.6 1.4-1.3 2.2-2-.7c-.4.3-.9.6-1.4.8l-.4 2.1H8.7l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .7-1.3-2.2 1.6-1.4a4.6 4.6 0 010-1.6L3.6 5.9l1.3-2.2 2 .7c.4-.3.9-.6 1.4-.8l.4-2.1h2.6zM10 7a3 3 0 100 6 3 3 0 000-6z"
            transform="translate(0 1)"
          />
        </svg>
      </button>
    </header>

    <main>
      <section id="mainView" hidden>
        <button id="draftBtn" class="btn primary block">Draft reply</button>

        <div id="templatesLabel" class="label">Templates</div>
        <div id="templateBtns" class="chips"></div>

        <textarea
          id="note"
          rows="2"
          placeholder="Optional note: what to write, or what to fix in the draft"
        ></textarea>
        <button id="noteBtn" class="btn block">Draft from my note</button>

        <div id="busy" class="busy" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="busyText">Drafting…</span>
          <button id="cancelBtn" class="link">Cancel</button>
        </div>
        <div id="error" class="error" role="alert" hidden></div>

        <div id="result" hidden>
          <div id="decision" class="decision"></div>
          <div id="siteWarning" class="warning" hidden></div>
          <div id="draftBox">
            <div id="ccRow" class="cc" hidden>
              <div><strong>CC:</strong> <span id="ccList"></span></div>
              <div id="ccHint" class="hint"></div>
            </div>
            <textarea id="draft" class="draft" spellcheck="true" aria-label="Draft reply"></textarea>
            <div class="actions">
              <button id="openReplyBtn" class="btn primary desktop-only">Open reply</button>
              <button id="copyBtn" class="btn">Copy</button>
            </div>
          </div>
          <div id="hint" class="hint"></div>
        </div>
      </section>

      <section id="composeView" hidden>
        <div class="label">This reply</div>
        <div id="composeDecision" class="decision"></div>
        <div id="composeCc" class="hint"></div>
        <button id="addCcBtn" class="btn primary block">Add colleagues to CC</button>
        <button id="insertBtn" class="btn block">Insert the draft</button>
        <div id="composeHint" class="hint"></div>
      </section>

      <section id="settingsView" hidden>
        <p id="settingsIntro" class="intro" hidden>
          Welcome. Add your OpenRouter key and paste your playbook to get started.
        </p>
        <label class="field">
          <span>OpenRouter API key</span>
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>Model</span>
          <input id="model" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span>Playbook</span>
          <textarea id="playbook" rows="18" spellcheck="false"></textarea>
        </label>
        <div id="playbookSize" class="hint"></div>
        <div id="settingsError" class="error" role="alert" hidden></div>
        <div class="actions">
          <button id="saveBtn" class="btn primary">Save</button>
          <button id="cancelSettingsBtn" class="btn">Cancel</button>
        </div>
        <p class="hint">
          Saved in your Outlook mailbox, readable only by this add-in, and synced to Outlook on your other devices.
        </p>
      </section>
    </main>
  </body>
</html>
